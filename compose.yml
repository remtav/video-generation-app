# Full stack. Works on any machine: the worker runs the CPU FakeEngine.
# On the RTX 3090 host add the GPU override:
#   docker compose -f compose.yml -f compose.gpu.yml up -d --build
name: vidgen

x-backend-env: &backend-env
  VIDGEN_DATABASE_URL: postgresql+asyncpg://vidgen:${POSTGRES_PASSWORD:-vidgen}@postgres:5432/vidgen
  VIDGEN_REDIS_URL: redis://redis:6379/0
  VIDGEN_STORAGE_DIR: /data
  VIDGEN_ENGINE: ${VIDGEN_ENGINE:-fake}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vidgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidgen}
      POSTGRES_DB: vidgen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidgen -d vidgen"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      target: api
    image: vidgen-api
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: api
    image: vidgen-api
    environment: *backend-env
    volumes:
      - media:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz')"
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: worker
    image: vidgen-worker
    environment: *backend-env
    volumes:
      - media:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Healthy once the worker has loaded its engine and published a heartbeat.
      test:
        - CMD
        - python
        - -c
        - "import os, redis, sys; r = redis.Redis.from_url(os.environ['VIDGEN_REDIS_URL']); sys.exit(0 if r.exists('vidgen:worker:heartbeat') else 1)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:8000
    image: vidgen-frontend
    ports:
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
