[project]
name = "vidgen"
version = "0.1.0"
description = "Self-hosted video generation web app: API and GPU worker"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "alembic>=1.13",
    "arq>=0.26",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "imageio>=2.35",
    "imageio-ffmpeg>=0.5",
    "numpy>=1.26",
    "pillow>=10.4",
    "pydantic-settings>=2.5",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Installed only in the CUDA worker image (RTX 3090 host).
gpu = [
    "accelerate>=1.6",
    "diffusers>=0.40",
    "ftfy>=6.2",
    "sentencepiece>=0.2",
    "torch>=2.8",
    "transformers>=4.51",
]
# Same stack with CPU-only torch: runs the Wan engine tests with tiny random models
# (CI, machines without a GPU). Mutually exclusive with "gpu".
cpu = [
    "accelerate>=1.6",
    "diffusers>=0.40",
    "ftfy>=6.2",
    "sentencepiece>=0.2",
    "torch>=2.8",
    "transformers>=4.51",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vidgen"]

[tool.uv]
environments = ["sys_platform == 'linux'"]
conflicts = [[{ extra = "gpu" }, { extra = "cpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "gpu" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["arq.*", "imageio.*", "imageio_ffmpeg.*", "torch.*", "diffusers.*", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# diffusers and transformers are untyped.
module = ["vidgen.worker.engines.wan", "tests.test_wan_engine"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
